apiVersion: v2
name: afwd-engine
description: AFW-D Design Engine Helm Chart
version: 0.1.0
appVersion: 0.1.0

keywords:
  - aircraft
  - design
  - langgraph
  - ai

maintainers:
  - name: Your Organization
    email: engineering@example.com

dependencies:
  - name: postgresql
    version: 12.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 17.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: prometheus
    version: 25.x.x
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.enabled

values:
  replicaCount: 1

  image:
    repository: ghcr.io/yourorg/afwd-engine
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000

  resources:
    limits:
      cpu: 4
      memory: 16Gi
      nvidia.com/gpu: 1
    requests:
      cpu: 2
      memory: 8Gi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  env:
    - name: LOG_LEVEL
      value: INFO
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: REDIS_URL
      value: redis://redis:6379
    - name: DATABASE_URL
      value: postgresql://postgres:password@postgres:5432/afwd

  postgresql:
    enabled: true
    auth:
      username: afwd
      password: afwdpassword
      database: afwd
    primary:
      persistence:
        enabled: true
        size: 10Gi

  redis:
    enabled: true
    auth:
      password: afwdpassword

  monitoring:
    enabled: true
    prometheus:
      enabled: true

  ingress:
    enabled: false