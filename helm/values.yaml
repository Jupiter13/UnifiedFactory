# Default values for AFW-D Engine
# This file can be updated with environment-specific settings

replicaCount: 1

image:
  repository: ghcr.io/yourorg/afwd-engine
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 4
    memory: 16Gi
    nvidia.com/gpu: 1
  requests:
    cpu: 2
    memory: 8Gi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  - name: LOG_LEVEL
    value: INFO
  - name: PYTHONUNBUFFERED
    value: "1"
  - name: REDIS_URL
    value: redis://redis:6379
  - name: DATABASE_URL
    value: postgresql://postgres:password@postgres:5432/afwd
  - name: LANGSMITH_API_KEY
    value: ""
  - name: OPENAI_API_KEY
    value: ""

# Service accounts
serviceAccount:
  create: true
  name: afwd-engine

# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: afwd.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Node selection
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - afwd-engine
          topologyKey: kubernetes.io/hostname